<!DOCTYPE html>
<html lang="en" data-theme="light" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RuPayVault - Bank Accounts Manager (Card Manager Style)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .light body, html.light body {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .dark body, html.dark body {
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    .font-mono-apple {
      font-family: 'JetBrains Mono', -apple-system, monospace;
    }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }

    /* Prototype Switcher Navigation */
    .proto-nav-pill {
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .light .proto-nav-pill.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }
    .light .proto-nav-pill.inactive {
      background: rgba(255, 255, 255, 0.95);
      color: #64748b;
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .light .proto-nav-pill.inactive:hover {
      background: #ffffff;
      color: #0f172a;
    }
    .dark .proto-nav-pill.active {
      background: #38bdf8;
      color: #041322;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }
    .dark .proto-nav-pill.inactive {
      background: rgba(30, 41, 59, 0.85);
      color: #94a3b8;
      border: 1px solid rgba(51, 65, 85, 0.8);
    }
    .dark .proto-nav-pill.inactive:hover {
      background: #1e293b;
      color: #ffffff;
    }

    /* Carousel 1: Member Pill Chips */
    .member-chip {
      padding: 7px 13px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .light .member-chip.active {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }
    .light .member-chip.inactive {
      background: #ffffff;
      color: #475569;
      border: 1px solid #e2e8f0;
    }
    .light .member-chip.inactive:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .dark .member-chip.active {
      background: #38bdf8;
      color: #031323;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
    }
    .dark .member-chip.inactive {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .dark .member-chip.inactive:hover {
      background: #334155;
      color: #f8fafc;
    }

    /* Carousel 2: Bank Pill Chips */
    .bank-chip {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .light .bank-chip.active {
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #0f172a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .light .bank-chip.inactive {
      background: rgba(241, 245, 249, 0.85);
      color: #64748b;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .light .bank-chip.inactive:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    .dark .bank-chip.active {
      background: #1e293b;
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .dark .bank-chip.inactive {
      background: rgba(30, 41, 59, 0.6);
      color: #94a3b8;
      border: 1px solid rgba(51, 65, 85, 0.7);
    }
    .dark .bank-chip.inactive:hover {
      background: #334155;
      color: #f1f5f9;
    }

    /* Tactile Card Field Button (Card Manager Style) */
    .tactile-copy-field {
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tactile-copy-field:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .tactile-copy-field:active {
      transform: scale(0.97);
    }
    .tactile-copy-field.just-copied .copy-target-text {
      color: #34d399 !important;
    }
    .tactile-copy-field.just-copied .copy-target-icon {
      color: #34d399 !important;
      opacity: 1 !important;
    }

    /* Luxury Bank Card Shimmer & Gradients */
    .bank-card {
      position: relative;
      border-radius: 20px;
      padding: 18px 20px;
      color: white;
      overflow: hidden;
      box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }
    .bank-card:hover {
      transform: translateY(-2px);
    }
    .bank-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: radial-gradient(circle at 85% 15%, rgba(255,255,255,0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .bank-card::after {
      content: '';
      position: absolute;
      bottom: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Gradient Palettes for Banks */
    .bg-indusind-pioneer {

    .bg-hsbc-premier {

    .bg-pnb-elite {

      font-weight: 800;

    .holder-badge {

          <!-- Dynamically generated based on selected member -->

      </div>

    </div>

    <!-- Dynamic Content Area -->
    <div id="dynamicContentArea" class="space-y-3.5">
      <!-- Injected by JavaScript based on active prototype and dual-carousel filters -->

      }).catch(err => {
        console.error('Clipboard copy failed:', err);
      });
    }

    function showToast(text) {
      const banner = document.getElementById('toastNotification');
      const textEl = document.getElementById('toastNotificationText');
      textEl.textContent = text;
      banner.classList.remove('opacity-0', '-translate-y-2');
      banner.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-2');
      }, 1400);
    }

    // Prototype Switcher
    function switchPrototype(num) {
      currentProto = num;
      for (let i = 1; i <= 3; i++) {
        const pill = document.getElementById(`protoPill${i}`);
        if (pill) {
          if (i === num) {
            pill.classList.remove('inactive');
            pill.classList.add('active');
          } else {
            pill.classList.remove('active');
            pill.classList.add('inactive');
          }
        }
      }
      renderContent();
    }

    // LAYER 1: MEMBER CAROUSEL RENDERER
    function renderMemberCarousel() {
      const track = document.getElementById('memberCarouselTrack');
      let html = '';

      MEMBERS.forEach(m => {
        const isActive = m.id === selectedMember;
        html += `
          <button onclick="selectMember('${m.id}')" class="member-chip ${isActive ? 'active' : 'inactive'}">
            <span class="w-5 h-5 rounded-full ${m.avatarBg} text-white flex items-center justify-center text-[10px] font-extrabold shadow-sm">
              ${m.short}
            </span>
            <span>${m.name}</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded-full font-mono font-bold ${isActive ? 'bg-white/20 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300'}">
              ${m.count}
            </span>
          </button>
        `;
      });

      track.innerHTML = html;
    }

    function selectMember(memberId) {
      selectedMember = memberId;
      selectedBank = 'all';
      renderMemberCarousel();
      renderBankCarousel();
      renderContent();

      setTimeout(() => {
        const activeChip = document.querySelector('#memberCarouselTrack .member-chip.active');
        if (activeChip) {
          activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }, 50);
    }

    // LAYER 2: BANK CAROUSEL RENDERER
    function renderBankCarousel() {
      const track = document.getElementById('bankCarouselTrack');
      
      let memberAccounts = BANK_ACCOUNTS;
      if (selectedMember !== 'all') {
        memberAccounts = BANK_ACCOUNTS.filter(a => a.memberId === selectedMember);
      }

      const bankMap = new Map();
      memberAccounts.forEach(a => {
        if (!bankMap.has(a.code)) {
          bankMap.set(a.code, { code: a.code, name: a.shortBank, count: 0 });
        }
        bankMap.get(a.code).count++;
      });

      const uniqueBanks = Array.from(bankMap.values());
      let html = '';

      const isAllActive = selectedBank === 'all';
      html += `
        <button onclick="selectBank('all')" class="bank-chip ${isAllActive ? 'active' : 'inactive'}">
          <span>All Banks</span>
          <span class="text-[9px] px-1.5 py-0.2 rounded-full font-mono font-bold ${isAllActive ? 'bg-indigo-500 text-white' : 'bg-slate-300 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">
            ${memberAccounts.length}
          </span>
        </button>
      `;

      uniqueBanks.forEach(b => {
        const isActive = b.code === selectedBank;
        html += `
          <button onclick="selectBank('${b.code}')" class="bank-chip ${isActive ? 'active' : 'inactive'}">
            <span>${b.name}</span>
            <span class="text-[9px] px-1.5 py-0.2 rounded-full font-mono font-bold ${isActive ? 'bg-sky-500 text-white' : 'bg-slate-300 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">
              ${b.count}
            </span>
          </button>
        `;
      });

      track.innerHTML = html;
      document.getElementById('bankCountBadge').textContent = `${uniqueBanks.length} Banks Available`;
    }

    function selectBank(bankCode) {
      selectedBank = bankCode;
      renderBankCarousel();
      renderContent();

      setTimeout(() => {
        const activeChip = document.querySelector('#bankCarouselTrack .bank-chip.active');
        if (activeChip) {
          activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }, 50);
    }

    // MAIN CONTENT DISPATCHER
    function renderContent() {
      const container = document.getElementById('dynamicContentArea');

      let filtered = BANK_ACCOUNTS;
      if (selectedMember !== 'all') {
        filtered = filtered.filter(a => a.memberId === selectedMember);
      }
      if (selectedBank !== 'all') {
        filtered = filtered.filter(a => a.code === selectedBank);
      }

      // Empty State
      if (!filtered.length) {
        const memObj = MEMBERS.find(m => m.id === selectedMember) || { name: 'Member', short: 'User' };
        container.innerHTML = `
          <div class="py-12 px-6 text-center rounded-2xl border light:bg-white light:border-slate-200 dark:bg-slate-800/60 dark:border-slate-700">

              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>

              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span>+ Add Bank Account for ${memObj.short}</span>
            </button>
          </div>
        `;
        return;
      }

      if (currentProto === 1) {
        renderCardManagerStyle(container, filtered);
      } else if (currentProto === 2) {
        renderAccordionStyle(container, filtered);
      } else if (currentProto === 3) {
        renderWireDeskStyle(container, filtered);
      }

      const drawer = document.getElementById(`drawer-${id}`);
      const chevron = document.getElementById(`chevron-${id}`);
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
      } else {
        drawer.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
    }

    // ========================================================
    // PROTOTYPE 3: WIRE TRANSFER DESK (TACTILE STYLE)
    // ========================================================
    function renderWireDeskStyle(container, accounts) {
      let html = `
        <div class="p-3 rounded-xl border light:bg-sky-50/70 light:border-sky-200 dark:bg-sky-950/20 dark:border-sky-900/40 mb-2 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            <span class="text-xs font-bold light:text-sky-900 dark:text-sky-200">Wire Routing Desk (${accounts.length} Accounts)</span>
          </div>
          <span class="text-[10px] font-mono text-sky-600 font-bold">Tap Field to Copy</span>
        </div>
      `;

      accounts.forEach(acc => {
        const isIndividuallyPeeked = individualPeekStates.has(acc.id);
        const isCurrentlyUnmasked = (!isGlobalMasked) || isIndividuallyPeeked;
        const displayNumber = isCurrentlyUnmasked ? acc.accNumber : acc.maskedNumber;

        html += `
          <div class="p-3 rounded-xl border transition-all light:bg-white light:border-slate-200/90 dark:bg-slate-800/80 dark:border-slate-700/80 shadow-sm">
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold light:text-slate-900 dark:text-white">${acc.shortBank}</span>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${acc.memberId === 'sanjay' ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400' : 'bg-sky-500/10 text-sky-600 dark:text-sky-400'}">${acc.holder}</span>
              </div>
              <span class="text-[10px] font-mono text-slate-400">${acc.tier}</span>
            </div>

            <!-- Number Tactile Row -->
            <button onclick="quickCopyCardField('${acc.accNumber}', 'Account number', this)" class="tactile-copy-field w-full p-2.5 rounded-lg light:bg-slate-50 dark:bg-slate-900/60 mb-2 flex items-center justify-between text-left">
              <div>
                <div class="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">Account Number</div>
                <div class="text-sm font-mono-apple font-extrabold tracking-wide light:text-slate-800 dark:text-slate-100 copy-target-text">${displayNumber}</div>
              </div>
              ${COPY_SVG}
            </button>

            <!-- IFSC and UPI direct copy rows -->
            <div class="grid grid-cols-2 gap-2 text-[11px] font-mono-apple">
              <button onclick="quickCopyCardField('${acc.ifsc}', 'IFSC code', this)" class="tactile-copy-field p-1.5 rounded-lg flex items-center justify-between text-left light:bg-slate-50 dark:bg-slate-900/40">
                <div class="truncate">
                  <span class="text-[9px] text-slate-400 font-sans block font-semibold">IFSC</span>
                  <span class="font-bold light:text-slate-700 dark:text-slate-300 copy-target-text">${acc.ifsc}</span>
                </div>
                ${MICRO_COPY_SVG}
              </button>

              ${acc.upi ? `
                <button onclick="quickCopyCardField('${acc.upi}', 'UPI VPA', this)" class="tactile-copy-field p-1.5 rounded-lg flex items-center justify-between text-left light:bg-emerald-50/60 dark:bg-emerald-950/20">
                  <div class="truncate">
                    <span class="text-[9px] text-emerald-600 dark:text-emerald-400 font-sans block font-bold">UPI VPA</span>
                    <span class="font-medium text-emerald-600 dark:text-emerald-400 truncate block copy-target-text">${acc.upi}</span>
                  </div>
                  ${MICRO_COPY_SVG}
                </button>
              ` : `
                <div class="p-1.5 rounded-lg light:bg-slate-50 dark:bg-slate-900/40">
                  <span class="text-[9px] text-slate-400 font-sans block font-semibold">ROUTING</span>
                  <span class="font-bold text-slate-500">NEFT / RTGS</span>
                </div>
              `}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function simulateAddAccount(memberName) {
      alert(`Add Bank Account modal will open for: ${memberName || 'Selected Member'}`);
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      renderMemberCarousel();
      renderBankCarousel();
      renderContent();
    });
  </script>
</body>
</html>
