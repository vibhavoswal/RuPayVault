<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RuPay Vault — VIP Wallet Carousel (Approach 4)</title>
  <!-- Tailwind Play CDN for preview rendering -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              dark: '#0A0A0C',
              card: '#16161A',
              border: '#27272A',
              whatsapp: '#25D366'
            }
          },
          fontFamily: {
            mono: ['SF Mono', 'Menlo', 'Monaco', 'Courier New', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    body {
      background-color: #0A0A0C;
      color: #EDEDED;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .font-mono-apple {
      font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.05em;
    }
    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-9px); }
      40%, 80% { transform: translateX(9px); }
    }
    .pin-shake {
      animation: pinShake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="bg-[#0A0A0C] text-neutral-100 flex flex-col h-screen w-screen overflow-hidden">

  <!-- Desktop Simulator Wrapper (Auto adapts on real mobile, centered max-w-md on desktop) -->
  <div class="flex-1 flex flex-col items-center justify-center p-0 md:p-6 w-full h-full bg-[#070709]">
    
    <!-- Outer iPhone 16 Pro Container -->
    <div id="device-container" class="relative w-full h-full md:max-w-[420px] md:h-[880px] md:max-h-[95vh] md:rounded-[48px] md:border-[10px] md:border-neutral-800 md:shadow-[0_25px_70px_rgba(0,0,0,0.85)] flex flex-col overflow-hidden bg-[#0D0D11]">
      
      <!-- ======================================================== -->
      <!-- 0. BIOMETRIC & 6-DIGIT PIN LOCK SCREEN (Apple HIG Style) -->
      <!-- ======================================================== -->
      <div id="vault-lock-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-between p-6 bg-gradient-to-b from-[#0f0f14] via-[#09090c] to-[#040406] text-white select-none">
        
        <!-- Top Area: Status & Shield Icon -->
        <div class="w-full pt-10 flex flex-col items-center text-center space-y-3">
          <div class="relative">
            <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-amber-400/20 to-amber-600/10 border border-amber-500/30 flex items-center justify-center shadow-[0_0_35px_rgba(251,191,36,0.15)]">
              <svg class="w-10 h-10 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="3" ry="3"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
            <div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center text-[10px]">
              🔒
            </div>
          </div>

          <div>
            <h1 class="text-xl font-bold tracking-tight text-neutral-100">RuPay Select Vault</h1>
            <p id="lock-subtitle" class="text-xs text-neutral-400 mt-1 font-medium">Locked with Biometrics &amp; AES-256</p>
          </div>

          <!-- 6 PIN Dots -->
          <div id="pin-dots-container" class="flex items-center gap-3.5 pt-3">
            <div id="pin-dot-0" class="w-3.5 h-3.5 rounded-full border-2 border-neutral-600 transition-all duration-200"></div>
            <div id="pin-dot-1" class="w-3.5 h-3.5 rounded-full border-2 border-neutral-600 transition-all duration-200"></div>
            <div id="pin-dot-2" class="w-3.5 h-3.5 rounded-full border-2 border-neutral-600 transition-all duration-200"></div>
            <div id="pin-dot-3" class="w-3.5 h-3.5 rounded-full border-2 border-neutral-600 transition-all duration-200"></div>
            <div id="pin-dot-4" class="w-3.5 h-3.5 rounded-full border-2 border-neutral-600 transition-all duration-200"></div>
            <div id="pin-dot-5" class="w-3.5 h-3.5 rounded-full border-2 border-neutral-600 transition-all duration-200"></div>
          </div>
          
          <p id="pin-feedback" class="text-[11px] text-amber-400/80 font-mono-apple h-4"></p>
        </div>

        <!-- Center/Bottom Area: Keypad & Biometric Actions -->
        <div class="w-full max-w-[280px] pb-6 space-y-4">
          
          <!-- Quick Face ID Button -->
          <button id="btn-faceid-unlock" onclick="unlockWithBiometrics()" class="w-full py-2.5 px-4 rounded-xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-semibold flex items-center justify-center gap-2 active:scale-98 transition-all">
            <svg class="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 3H5a2 2 0 0 0-2 2v2"></path>
              <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
              <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
              <path d="M3 17v2a2 2 0 0 0 2 2h2"></path>
              <circle cx="9" cy="10" r="1"></circle>
              <circle cx="15" cy="10" r="1"></circle>
              <path d="M9 15c1 1 2 1.5 3 1.5s2-.5 3-1.5"></path>
            </svg>
            <span id="faceid-btn-label">Unlock with Face ID</span>
          </button>

          <!-- Circular 3x4 Keypad -->
          <div class="grid grid-cols-3 gap-3.5 justify-items-center">
            <button onclick="pressPinDigit('1')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">1</button>
            <button onclick="pressPinDigit('2')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">2</button>
            <button onclick="pressPinDigit('3')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">3</button>
            <button onclick="pressPinDigit('4')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">4</button>
            <button onclick="pressPinDigit('5')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">5</button>
            <button onclick="pressPinDigit('6')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">6</button>
            <button onclick="pressPinDigit('7')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">7</button>
            <button onclick="pressPinDigit('8')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">8</button>
            <button onclick="pressPinDigit('9')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">9</button>
            
            <button onclick="unlockWithBiometrics()" class="w-16 h-16 rounded-full bg-neutral-900/60 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 flex items-center justify-center text-amber-400 active:scale-90 transition-all shadow" title="Face ID">
              <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M3 17v2a2 2 0 0 0 2 2h2"></path>
                <circle cx="9" cy="10" r="1" fill="currentColor"></circle>
                <circle cx="15" cy="10" r="1" fill="currentColor"></circle>
                <path d="M9 15c1 1 2 1.5 3 1.5s2-.5 3-1.5"></path>
              </svg>
            </button>
            <button onclick="pressPinDigit('0')" class="w-16 h-16 rounded-full bg-neutral-900/90 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 text-xl font-bold active:scale-90 transition-all shadow">0</button>
            <button onclick="pressPinBackspace()" class="w-16 h-16 rounded-full bg-neutral-900/60 border border-neutral-800 hover:border-amber-500/40 hover:bg-neutral-800 flex items-center justify-center text-neutral-400 active:scale-90 transition-all shadow" title="Delete">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l7-7h11a2 2 0 012 2v10a2 2 0 01-2 2H10l-7-7z"/></svg>
            </button>
          </div>

          <div class="pt-2 text-center">

          </div>
        </div>
      </div>

        <div class="rounded-2xl max-w-xs w-full p-5 space-y-4 shadow-2xl bg-neutral-900 border border-neutral-800 text-white">
          <div class="flex items-center justify-between pb-2 border-b border-neutral-800">
            <h3 class="text-sm font-bold text-amber-400">Change 6-Digit PIN</h3>
            <button onclick="closeChangePinModal()" class="text-lg opacity-70 hover:opacity-100">&times;</button>
          </div>
          <div class="space-y-3">
            <div>
              <label class="block text-[10px] text-neutral-400 mb-1">Current PIN (Default: 123456)</label>
              <input type="password" id="input-curr-pin" maxlength="6" pattern="[0-9]*" inputmode="numeric" placeholder="Current PIN" class="w-full px-3 py-1.5 rounded-xl bg-black border border-neutral-800 text-sm font-mono-apple text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
              <label class="block text-[10px] text-neutral-400 mb-1">New 6-Digit PIN</label>
              <input type="password" id="input-new-pin" maxlength="6" pattern="[0-9]*" inputmode="numeric" placeholder="New 6-digit PIN" class="w-full px-3 py-1.5 rounded-xl bg-black border border-neutral-800 text-sm font-mono-apple text-white focus:outline-none focus:border-amber-400">
            </div>
            <div>
              <label class="block text-[10px] text-neutral-400 mb-1">Confirm New PIN</label>
              <input type="password" id="input-confirm-pin" maxlength="6" pattern="[0-9]*" inputmode="numeric" placeholder="Confirm new PIN" class="w-full px-3 py-1.5 rounded-xl bg-black border border-neutral-800 text-sm font-mono-apple text-white focus:outline-none focus:border-amber-400">
            </div>
          </div>
          <div class="flex items-center justify-end gap-2 pt-2 border-t border-neutral-800">
            <button onclick="closeChangePinModal()" class="px-3 py-1 text-xs text-neutral-400 hover:text-white">Cancel</button>
            <button onclick="confirmChangePin()" class="px-3.5 py-1 rounded-xl text-xs font-bold bg-amber-400 text-black hover:bg-amber-300">Update</button>
          </div>
        </div>
      </div>
      
      <!-- iOS Dynamic Island (Desktop Simulator Decorative Only) -->
      <div class="hidden md:flex absolute top-3 left-1/2 -translate-x-1/2 w-28 h-6 bg-black rounded-full z-40 items-center justify-between px-3">
        <div class="w-2.5 h-2.5 rounded-full bg-neutral-900"></div>
        <div class="w-3 h-3 rounded-full bg-amber-950/60 flex items-center justify-center">
          <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
        </div>
      </div>

      <!-- ========================================================
           TOP BAR:
           1. Branding: RUPAY SELECT PASS + Brand Title
           2. Synced at [Time]
           3. Sync Icon
           4. ONLY ONE SELECT BUTTON AT THE TOP
           ======================================================== -->
      <header class="shrink-0 border-b border-neutral-800 bg-neutral-950 z-30 pt-[calc(env(safe-area-inset-top,0px)+8px)] md:pt-10 px-3.5 pb-2.5 flex items-center justify-between gap-2">
        <!-- Left: Link to Google Sheet (Icon Only) -->
        <a id="sheet-link-btn" href="https://docs.google.com/spreadsheets/d/13TlzJsJ3E3vbXYi_FASgQtr9rhORpEho0I57CFTQcOA/edit?usp=sharing" target="_blank" rel="noopener noreferrer" class="p-2 rounded-xl bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-900/50 hover:text-emerald-300 active:scale-90 transition-all flex items-center justify-center group" title="Google Sheet">
          <svg class="w-4 h-4 shrink-0 text-[#0F9D58] group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm0-4H6v-2h6v2zm0-4H6V7h6v2zm6 8h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2z"/>
          </svg>
        </a>

        <!-- Right Header Controls -->
        <div class="flex items-center gap-2 shrink-0">
          <span id="sync-time-label" class="text-[10px] text-neutral-400 font-mono-apple">Synced at 12:25 AM</span>
          
          <!-- Sync Button -->
          <button id="btn-sync" onclick="syncWithGoogleSheets()" class="p-1 rounded-full text-amber-400 hover:text-white active:scale-90 transition-transform" title="Sync Live Google Sheets">
            <svg id="sync-spinner" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>

          <!-- Lock Button -->
          <button onclick="lockVault()" class="p-1.5 rounded-lg bg-neutral-900 border border-neutral-800 text-amber-300 hover:text-white active:scale-90 transition-all text-xs" title="Lock Vault">
            🔒
          </button>

          <!-- ONLY ONE SELECT BUTTON AT THE TOP -->
          <button id="btn-select" onclick="toggleSelectMode()" class="px-3 py-1 rounded-lg text-xs font-bold bg-neutral-800 text-amber-300 border border-amber-400/30 hover:bg-neutral-700 active:scale-95 transition-all">
            Select
          </button>
        </div>
      </header>

      <!-- 10-Second Undo Banner -->
      <div id="undo-banner" class="hidden mx-3 mt-2 p-2.5 rounded-xl bg-emerald-950/90 border border-emerald-500/40 shadow-2xl flex items-center justify-between text-xs text-white backdrop-blur-md transition-all z-30">
        <div class="flex items-center gap-2 truncate">
          <span class="text-sm text-emerald-400">✓</span>
          <span id="undo-banner-text" class="truncate text-[11px] font-medium text-emerald-200">Voucher marked as Redeemed & moved to Sheet</span>
        </div>
        <button id="undo-banner-btn" onclick="triggerUndoLast()" class="shrink-0 px-2.5 py-1 rounded-lg bg-emerald-500 text-black font-bold text-[11px] hover:bg-emerald-400 active:scale-95 transition-all shadow">
          ↶ Undo (10s)
        </button>
      </div>

      <!-- ========================================================
           TOP DECK SELECTOR (Card-Style Horizontal Brand Pass Deck):
           Positioned at TOP ("everything at top looks better")
           Ordered in strict user preference
           ======================================================== -->
      <div id="brands-carousel" class="p-2.5 shrink-0 flex gap-2 overflow-x-auto no-scrollbar bg-black border-b border-neutral-800 z-20">
        <!-- Injected via JavaScript -->
      </div>

      <!-- ========================================================
           CUMULATIVE DENOMINATION BREAKDOWN BANNER:
           Clear single-line banner showing available balance
           ======================================================== -->
      <div class="mx-3 my-2 px-3 py-1.5 rounded-xl bg-gradient-to-r from-neutral-900 via-neutral-900 to-neutral-950 border border-neutral-800 flex justify-between items-center text-[10.5px] sm:text-xs shrink-0 shadow-md whitespace-nowrap overflow-hidden">
        <span class="text-neutral-400 font-medium tracking-tight">Cumulative Denomination:</span>
        <span id="cumulative-pill" class="font-bold text-amber-400 font-mono-apple pl-2 tracking-tight">Loading...</span>
      </div>

      <!-- Activity Log Sub-Filters (Visible ONLY when Activity Log tab is selected) -->
      <div id="activity-filters-bar" class="hidden mx-3 mb-2 flex items-center gap-1.5 shrink-0 overflow-x-auto no-scrollbar">
        <button onclick="setActivityFilter('all')" id="btn-filter-all" class="px-2.5 py-1 rounded-lg text-[10.5px] font-bold bg-amber-400 text-black shadow transition-all">All Activity</button>
        <button onclick="setActivityFilter('added')" id="btn-filter-added" class="px-2.5 py-1 rounded-lg text-[10.5px] font-medium bg-neutral-900 text-neutral-300 border border-neutral-800 hover:border-neutral-700 transition-all">⚡ Ingested</button>
        <button onclick="setActivityFilter('shared')" id="btn-filter-shared" class="px-2.5 py-1 rounded-lg text-[10.5px] font-medium bg-neutral-900 text-neutral-300 border border-neutral-800 hover:border-neutral-700 transition-all">📤 Shared</button>
        <button onclick="setActivityFilter('redeemed')" id="btn-filter-redeemed" class="px-2.5 py-1 rounded-lg text-[10.5px] font-medium bg-neutral-900 text-neutral-300 border border-neutral-800 hover:border-neutral-700 transition-all">📜 Redeemed</button>
      </div>

      <!-- ========================================================
           MAIN VOUCHER FEED:
           Scrollable list with luxury VIP pass cards, embossed codes,
           Four Fountains expiry warnings, and checkboxes in select mode.
           ======================================================== -->
      <main id="vouchers-feed" class="flex-1 overflow-y-auto px-3.5 py-2 space-y-3 no-scrollbar pb-24">
        <!-- Injected via JavaScript -->
      </main>

      <!-- ========================================================
           HOVERING WHATSAPP BUTTON (FAB):
           ONLY displayed when 'Select' is active.
           Fixed in bottom right.
           Clicking opens native iOS Share Sheet / WhatsApp.
           ======================================================== -->
      <!-- Hovering Action Dock: Visible ONLY when Select mode is active -->
      <div id="fab-actions-dock" class="hidden fixed right-4 z-40 items-center gap-2.5" style="bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));">
        <!-- Mark Redeemed FAB -->
        <button id="fab-redeem" onclick="batchMarkAsRedeemed()" class="relative h-13 px-4 rounded-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-[0_8px_25px_rgba(16,185,129,0.45)] flex items-center gap-2 hover:scale-105 active:scale-95 transition-all border border-emerald-400/30 font-bold text-xs" title="Mark Selected as Redeemed">

            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          <span>Redeem</span>
          <span id="fab-redeem-badge" class="hidden min-w-[20px] h-[20px] px-1.5 flex items-center justify-center text-[10.5px] font-black text-black bg-white rounded-full shadow">0</span>
        </button>

        <!-- WhatsApp FAB -->
        <button id="fab-whatsapp" onclick="shareSelectedOnWhatsApp()" class="relative w-13 h-13 rounded-full bg-[#25D366] text-white shadow-[0_8px_25px_rgba(37,211,102,0.45)] flex items-center justify-center hover:scale-105 active:scale-95 transition-all border border-white/25" title="Share Selected via WhatsApp">
          <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86.173.086.275.072.376-.044.101-.116.433-.506.549-.68.116-.174.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.043.072.043.419-.101.824z"/>
          </svg>
          <span id="fab-badge" class="hidden absolute -top-1 -right-1 min-w-[20px] h-[20px] px-1 flex items-center justify-center text-[10.5px] font-black text-black bg-amber-400 rounded-full border border-black shadow">0</span>

      <!-- Toast Feedback Popup -->
      <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-xs font-semibold text-white bg-neutral-900/90 border border-neutral-700 shadow-2xl transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
        Copied to clipboard
      </div>

    </div>
  </div>

  <script>
    // Live GAS endpoint for RuPay Sheets
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxhdhzl1DpHnvGXYV0KaENylb6hUw-s_hzo39nsSf37dxwnSnuh-OPrWLlvSJvfvwpwZw/exec";
    const VAULT_AUTH_KEY = "rupay_vault_auth_sec_8f93e2a1c0d4";

    /* --- SECURITY, BIOMETRICS & AES-GCM ENCRYPTED CACHE --- */
    const securityState = {
      isUnlocked: false,
      enteredPin: '',
      masterPinHash: localStorage.getItem('rupay_vault_pin_hash') || null,
      cryptoKey: null,
      inactivityTimer: null,
      hasBiometrics: false
    };

    // SHA-256 Hash helper
    async function sha256(str) {
      const enc = new TextEncoder();
      const hash = await crypto.subtle.digest('SHA-256', enc.encode(str));
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Initialize Default PIN Hash ("123456") if none exists
    (async function initPinHash() {
      if (!securityState.masterPinHash) {
        const defaultHash = await sha256("123456");
        securityState.masterPinHash = defaultHash;
        localStorage.setItem('rupay_vault_pin_hash', defaultHash);
      }
    })();

    // Derive AES-GCM Key from PIN using PBKDF2
    async function deriveKeyFromPin(pin, saltBytes) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(pin),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // Encrypt payload with AES-GCM
    async function encryptWithKey(key, plaintext) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const enc = new TextEncoder();
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(plaintext)
      );
      return {
        iv: Array.from(iv),
        ciphertext: Array.from(new Uint8Array(ciphertext))
      };
    }

    // Decrypt payload with AES-GCM
    async function decryptWithKey(key, encryptedObj) {
      const iv = new Uint8Array(encryptedObj.iv);
      const ciphertext = new Uint8Array(encryptedObj.ciphertext);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertext
      );
      const dec = new TextDecoder();
      return dec.decode(decrypted);
    }

    // Save vouchers to AES-GCM encrypted cache in localStorage
    async function saveEncryptedVouchers(vouchers) {
      try {
        if (!securityState.cryptoKey) return;
        const serialized = JSON.stringify(vouchers);
        const encrypted = await encryptWithKey(securityState.cryptoKey, serialized);
        localStorage.setItem('rupay_vault_preview_encrypted_cache', JSON.stringify(encrypted));
        localStorage.removeItem('rupay_vouchers_grouped'); // clear unencrypted legacy cache
      } catch (err) {
        console.warn("Failed to save encrypted cache:", err);
      }
    }

    // Load and decrypt vouchers from cache
    async function loadEncryptedVouchers() {
      try {
        const cached = localStorage.getItem('rupay_vault_preview_encrypted_cache');
        if (!cached || !securityState.cryptoKey) return null;
        const parsed = JSON.parse(cached);
        const decryptedJson = await decryptWithKey(securityState.cryptoKey, parsed);
        const vouchers = JSON.parse(decryptedJson);
        return (vouchers && typeof vouchers === 'object') ? vouchers : null;
      } catch (err) {
        console.warn("Encrypted cache decryption failed:", err);
        return null;
      }
    }

    // Register WebAuthn Biometric Credential
    async function registerBiometrics() {
      if (!window.PublicKeyCredential) {
        showToast("Biometrics not supported on this browser");
        return false;
      }
      try {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16);
        crypto.getRandomValues(userId);

        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge,
            rp: { name: "RuPay Vault" },
            user: {
              id: userId,
              name: "owner@rupayvault",
              displayName: "RuPay Vault Owner"
            },
            pubKeyCredParams: [
              { type: "public-key", alg: -7 },  // ES256
              { type: "public-key", alg: -257 } // RS256
            ],
            authenticatorSelection: {
              authenticatorAttachment: "platform",
              userVerification: "required"
            },
            timeout: 60000
          }
        });

        if (credential && credential.id) {
          localStorage.setItem('rupay_bio_cred_id', credential.id);
          securityState.hasBiometrics = true;
          showToast("Face ID / Biometrics registered!");
          const label = document.getElementById('faceid-btn-label');
          if (label) label.textContent = "Unlock with Face ID";
          return true;
        }
      } catch (err) {
        console.warn("Biometric registration cancelled or failed:", err);
        showToast("Biometrics cancelled");
        return false;
      }
      return false;
    }

    // Unlock with Face ID / Touch ID
    async function unlockWithBiometrics() {
      const credId = localStorage.getItem('rupay_bio_cred_id');
      if (!credId) {
        const reg = await registerBiometrics();
        if (reg) {
          await unlockVaultDirect("123456");
        }
        return;
      }

      try {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);

        let rawId;
        try {
          rawId = Uint8Array.from(atob(credId.replace(/_/g, '/').replace(/-/g, '+')), c => c.charCodeAt(0));
        } catch(e) {
          rawId = new TextEncoder().encode(credId);
        }

        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge: challenge,
            allowCredentials: [{
              id: rawId,
              type: "public-key"
            }],
            userVerification: "required",
            timeout: 60000
          }
        });

        if (assertion) {
          await unlockVaultDirect();
          showToast("Unlocked with Face ID");
        }
      } catch (err) {
        console.warn("Biometric verification cancelled:", err);
      }
    }

    async function verifyEnteredPin() {
      const entered = securityState.enteredPin;
      const hash = await sha256(entered);
      const expected = securityState.masterPinHash || await sha256("123456");

      if (hash === expected) {
        for (let i = 0; i < 6; i++) {

        await unlockVaultDirect(entered);

        for (let i = 0; i < 6; i++) {

    // Unlock Vault and Hydrate
    async function unlockVaultDirect(pinUsed) {
      securityState.isUnlocked = true;
      securityState.enteredPin = '';
      updatePinDotsUI();

      const pin = pinUsed || "123456";
      let salt = localStorage.getItem('rupay_vault_salt');
      if (!salt) {
        const sBytes = crypto.getRandomValues(new Uint8Array(16));
        salt = JSON.stringify(Array.from(sBytes));
        localStorage.setItem('rupay_vault_salt', salt);
      }
      const saltBytes = new Uint8Array(JSON.parse(salt));
      securityState.cryptoKey = await deriveKeyFromPin(pin, saltBytes);

      const lockEl = document.getElementById('vault-lock-screen');
      if (lockEl) lockEl.classList.add('hidden');

      const decrypted = await loadEncryptedVouchers();
      if (decrypted && typeof decrypted === 'object') {
        Object.keys(decrypted).forEach(k => {
          liveVouchers[k] = decrypted[k];
        });
        updateHeader();
        renderBrandsCarousel();
        renderVouchersFeed();
      }

      syncWithGoogleSheets();
      resetInactivityTimer();
    }

      undoState.secondsLeft = 10;

      const banner = document.getElementById('undo-banner');
      const btn = document.getElementById('undo-banner-btn');
      const text = document.getElementById('undo-banner-text');

      if (banner && btn) {

        btn.textContent = `↶ Undo (${undoState.secondsLeft}s)`;
        banner.classList.remove('hidden');

          undoState.secondsLeft--;
          if (undoState.secondsLeft <= 0) {
            clearInterval(undoState.timer);
            undoState.timer = null;
            banner.classList.add('hidden');
          } else {
            btn.textContent = `↶ Undo (${undoState.secondsLeft}s)`;

        }, 1000);

    function normalizeBrandKey(brand) {
      if (!brand) return 'Other';
      const b = brand.toLowerCase().replace(/[\s\.\-_]/g, '');
      if (b.includes('activity') || b.includes('recent') || b.includes('newly') || b === 'activitylog' || b === 'recentlyadded') return 'ActivityLog';
      if (b.includes('lakme')) return 'Lakme';
      if (b.includes('fourfountain') || b.includes('four')) return 'FourFountains';
      if (b.includes('kalyan')) return 'Kalyan';
      if (b.includes('myntra')) return 'Myntra';
      if (b.includes('bigbasket')) return 'BigBasket';
      if (b.includes('reliance')) return 'Reliance';
      if (b.includes('apollo')) return 'Apollo';
      if (b.includes('amazon')) return 'AmazonPrime';
      if (b.includes('cult')) return 'CultFit';
      if (b.includes('timesprime')) return 'TimesPrime';
      if (b.includes('tattvaspa') || b.includes('tattva')) return 'TattvaSpa';
      if (b.includes('taxspanner') || b.includes('tax')) return 'TaxSpanner';
      if (b.includes('thyrocare')) return 'Thyrocare';
      if (b.includes('uber')) return 'Uber';
      return brand;
    }

    function parseTimestamp(ts) {
      if (!ts) return 0;
      const clean = String(ts).replace(/'IST'/i, '').replace(/IST/i, '').trim();
      const parsed = Date.parse(clean);
      if (!isNaN(parsed)) return parsed;

      const m = clean.match(/(\d{1,2})[-/ ]([A-Za-z]{3})[-/ ](\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
      if (m) {
        const day = parseInt(m[1], 10);
        const monthStr = m[2].toLowerCase();
        const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
        const month = months[monthStr.slice(0, 3)] ?? 0;
        const year = parseInt(m[3], 10);
        let hour = parseInt(m[4], 10);
        const min = parseInt(m[5], 10);
        const sec = m[6] ? parseInt(m[6], 10) : 0;
        const meridiem = m[7] ? m[7].toUpperCase() : null;
        if (meridiem === 'PM' && hour < 12) hour += 12;
        if (meridiem === 'AM' && hour === 12) hour = 0;
        return new Date(year, month, day, hour, min, sec).getTime();
      }
      return 0;
    }

        if (pill) {

        }
      } else if (activeBrandKey === 'Redeemed') {

        const totalValue = redeemedList.reduce((acc, r) => acc + (r.amount || 0), 0);
        if (pill) {

        }
      } else {
        if (activityFiltersBar) activityFiltersBar.classList.add('hidden');
        const denom = b.denom || 0;
        const total = count * denom;
        if (pill) {
          if (denom > 0) {
            pill.innerHTML = `${count} vouchers × ₹${denom.toLocaleString()} = ₹${total.toLocaleString()}`;
          } else {

              </div>
            `;
          }).join('');
        }
      }

      feed.innerHTML = html;
      updateFabVisibility();
    }

    // Switch Active Brand
    function setBrand(brandKey) {
      activeBrandKey = brandKey;
      localStorage.setItem('rupay_active_brand', brandKey);
      selectedCodes.clear();
      updateHeader();
      renderBrandsCarousel();
      renderVouchersFeed();
      document.getElementById('vouchers-feed').scrollTop = 0;
    }

    // Toggle Select Mode
    function toggleSelectMode() {
      isSelectMode = !isSelectMode;
      const btn = document.getElementById('btn-select');
      if (isSelectMode) {
        btn.textContent = 'Done';
        btn.classList.remove('bg-neutral-800', 'text-amber-300');
        btn.classList.add('bg-amber-400', 'text-black', 'shadow-md');
      } else {
        btn.textContent = 'Select';
        btn.classList.add('bg-neutral-800', 'text-amber-300');
        btn.classList.remove('bg-amber-400', 'text-black', 'shadow-md');
        selectedCodes.clear();
      }
      renderVouchersFeed();
    }

    // Toggle Checkbox for a Code
    function toggleSelectCode(code) {
      if (selectedCodes.has(code)) {
        selectedCodes.delete(code);
      } else {
        selectedCodes.add(code);
      }
      renderVouchersFeed();
    }

    // Manage Floating Action Dock (Redeem FAB & WhatsApp FAB)
    function updateFabVisibility() {
      const dock = document.getElementById('fab-actions-dock');
      const badge = document.getElementById('fab-badge');
      const redeemBadge = document.getElementById('fab-redeem-badge');

      if (isSelectMode) {
        if (dock) {
          dock.classList.remove('hidden');
          dock.classList.add('flex');
        }
        if (selectedCodes.size > 0) {
          if (badge) {
            badge.textContent = selectedCodes.size;
            badge.classList.remove('hidden');
          }
          if (redeemBadge) {
            redeemBadge.textContent = selectedCodes.size;
            redeemBadge.classList.remove('hidden');
          }
        } else {
          if (badge) badge.classList.add('hidden');
          if (redeemBadge) redeemBadge.classList.add('hidden');
        }
      } else {
        if (dock) {
          dock.classList.add('hidden');
          dock.classList.remove('flex');
        }
      }
    }

    // Share Selected Vouchers on WhatsApp with Native Share Sheet
    function shareSelectedOnWhatsApp() {
      if (isSelectMode && !selectedCodes.size) {
        showToast("Please select at least 1 voucher to share");
        return;
      }
      const allVs = liveVouchers[activeBrandKey] || [];
      const vs = allVs.filter(v => selectedCodes.has(v.code));
      const targets = vs.length > 0 ? vs : allVs;
      const b = BRAND_CONFIG.find(x => x.key === activeBrandKey);
      const isActivityTab = activeBrandKey === 'ActivityLog';
      const count = targets.length;

      // Log all shared items into activity state
      targets.forEach(v => {
        const vBrand = v.brand || (b ? b.name : 'Voucher');
        logSharedActivity(v.code, vBrand, v.amount, v.pin);
      });

      // Special custom format for Amazon Prime vouchers
      if (targets.every(v => normalizeBrandKey(v.brand) === 'AmazonPrime')) {
        let text = targets.length === 1
          ? `Here's the code: ${targets[0].code}\n\nRedeem it on amazon.in/vouchers\n\nRs. 1499 will get added to your prime balance. You can use that balance to checkout Prime Membership.`
          : `Here's the code:\n${targets.map((v, i) => `${i + 1}. ${v.code}`).join('\n')}\n\nRedeem it on amazon.in/vouchers\n\nRs. 1499 will get added to your prime balance. You can use that balance to checkout Prime Membership.`;

        if (navigator.share) {
          navigator.share({
            title: `Amazon Prime Voucher`,
            text: text
          }).then(() => {
            showToast('Shared & logged to Activity Log');
            renderBrandsCarousel();
          }).catch(err => {
            if (err && err.name !== 'AbortError') {
              openDirectWhatsApp(text);
            }
          });
        } else {
          openDirectWhatsApp(text);
        }
        return;
      }

      let text = isActivityTab ? `⚡ Shared RuPay Vouchers\n\n` : `${b ? b.name : activeBrandKey} Vouchers\n\n`;
      let total = 0;
      targets.forEach((v, i) => {
        const vBrand = v.brand || (b ? b.name : 'Voucher');
        if (isActivityTab) {
          text += `${i + 1}. [${vBrand}${v.amount > 0 ? ` · ₹${v.amount.toLocaleString()}` : ''}] Code: ${v.code}\n`;
        } else {
          text += `${i + 1}. Code: ${v.code}\n`;
        }
        if (v.pin) text += `PIN: ${v.pin}\n`;
        text += `\n`;
        total += (v.amount || (b ? b.denom : 0));
      });
      text += `Total ${count} vouchers\n`;
      if (total > 0) text += `Total Value: ₹${total.toLocaleString()}`;

      // Open Native Share Sheet if available, else WhatsApp direct
      if (navigator.share) {
        navigator.share({
          title: `${b ? b.name : activeBrandKey} Vouchers`,
          text: text
        }).then(() => {
          showToast('Shared & logged to Activity Log');
          renderBrandsCarousel();
        }).catch(err => {
          if (err && err.name !== 'AbortError') {
            openDirectWhatsApp(text);
          }
        });
      } else {
        openDirectWhatsApp(text);
      }
    }

    // Share Single Voucher on WhatsApp
    function shareSingleWhatsApp(code) {
      let v = null;
      let brandName = activeBrandKey;
      Object.keys(liveVouchers).forEach(k => {
        const found = (liveVouchers[k] || []).find(x => x.code === code);
        if (found) {
          v = found;
          brandName = v.brand || k;
        }
      });
      if (!v) {
        const s = sharedActivity.find(x => x.code === code);
        if (s) {
          v = s;
          brandName = s.brand;
        }
      }
      if (!v) return;

      logSharedActivity(v.code, brandName, v.amount, v.pin);

      let text;
      if (activeBrandKey === 'AmazonPrime' || normalizeBrandKey(brandName) === 'AmazonPrime' || normalizeBrandKey(v.brand) === 'AmazonPrime') {
        text = `Here's the code: ${v.code}\n\nRedeem it on amazon.in/vouchers\n\nRs. 1499 will get added to your prime balance. You can use that balance to checkout Prime Membership.`;
      } else {
        text = `${brandName} Voucher\n\n`;
        text += `1. Code: ${v.code}\n`;
        if (v.pin) text += `PIN: ${v.pin}\n`;
        text += `\n`;
        if (v.amount > 0) text += `Value: ₹${v.amount.toLocaleString()}\n`;
      }

      if (navigator.share) {
        navigator.share({
          title: `${brandName} Voucher`,
          text: text
        }).then(() => {
          showToast('Shared & logged to Activity Log');
          renderBrandsCarousel();
        }).catch(() => openDirectWhatsApp(text));
      } else {
        openDirectWhatsApp(text);
      }
    }

    function openDirectWhatsApp(text) {
      copyToClipboard(text);
      showToast('Copied to clipboard! Opening WhatsApp...');
      const whatsappUrl = `whatsapp://send?text=${encodeURIComponent(text)}`;
      window.location.href = whatsappUrl;
    }

    // Copy Single Code
    function copyCode(code) {
      copyToClipboard(code);
      showToast(`Copied code: ${code}`);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.position = 'absolute';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 2000);
    }

    // Live Sync with Google Sheets
    async function syncWithGoogleSheets() {
      if (isSyncing) return;
      isSyncing = true;

      const spinner = document.getElementById('sync-spinner');
      if (spinner) spinner.classList.add('animate-spin');

      const syncLabel = document.getElementById('sync-time-label');
      if (syncLabel) {
        syncLabel.textContent = 'Syncing now...';
        syncLabel.classList.add('text-amber-400');
        syncLabel.classList.remove('text-neutral-400');
      }

      try {
        const syncUrl = API_ENDPOINT + (API_ENDPOINT.includes('?') ? '&' : '?') + `ingest=true&auth=${VAULT_AUTH_KEY}`;
        const res = await fetch(syncUrl);
        const data = await res.json();

        if (data.vouchers && data.vouchers.length) {
          const grouped = { ActivityLog: [] };
          data.vouchers.forEach(v => {
            const rawBrand = v.brand || 'Other';
            const normKey = normalizeBrandKey(rawBrand);
            if (!grouped[normKey]) grouped[normKey] = [];

            let redeemedOn = null;
            if (v.dateOfIssue && String(v.dateOfIssue).trim() && String(v.dateOfIssue).trim() !== '31 Dec 2026') {
              redeemedOn = String(v.dateOfIssue).trim();
            }

            const item = {
              code: v.code || '-',
              pin: v.pin || '',
              expiry: v.dateOfIssue || '31 Dec 2026',
              redeemedOn: redeemedOn,
              brand: rawBrand,
              amount: Number(v.amount) || 0,
              timestampIST: (v.timestampIST && String(v.timestampIST).trim() !== '' && String(v.timestampIST).trim() !== 'null') ? String(v.timestampIST).trim() : null,
              status: (v.status || 'ACTIVE').toUpperCase()
            };

            grouped[normKey].push(item);
            if (item.timestampIST) {
              grouped.ActivityLog.push(item);
            }
          });

          Object.keys(grouped).forEach(k => {
            liveVouchers[k] = grouped[k];
          });
          saveEncryptedVouchers(liveVouchers);
        }

        if (data.redeemed && Array.isArray(data.redeemed)) {
          redeemedList = data.redeemed.map(r => ({
            code: r.code,
            brand: r.brand || r.originalTab || 'Voucher',
            amount: Number(r.amount) || 0,
            pin: r.pin || '',
            redeemedTimestampIST: r.redeemedTimestampIST || '',
            originalTab: r.originalTab || r.brand || ''
          }));
          sharedActivity = sharedActivity.filter(s => !redeemedList.some(r => r.code === s.code));
          saveSharedActivity();
          saveRedeemedList();
        }

        if (data.sheetUrl) {
          const sheetLink = document.getElementById('sheet-link-btn');
          if (sheetLink) sheetLink.href = data.sheetUrl;
          localStorage.setItem('rupay_sheet_url', data.sheetUrl);
        }

        const now = new Date();
        syncTimestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        localStorage.setItem('rupay_sync_time', syncTimestamp);
      } catch (err) {
        console.warn('Sync failed, using cached data:', err);
        const now = new Date();
        syncTimestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' (cached)';
      } finally {
        isSyncing = false;
        if (spinner) spinner.classList.remove('animate-spin');
        if (syncLabel) {
          syncLabel.textContent = `Synced at ${syncTimestamp}`;
          syncLabel.classList.remove('text-amber-400');
          syncLabel.classList.add('text-neutral-400');
        }
        updateHeader();
        renderBrandsCarousel();
        renderVouchersFeed();
      }
    }

    // Initial Render
    (async function init() {
      const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/13TlzJsJ3E3vbXYi_FASgQtr9rhORpEho0I57CFTQcOA/edit?usp=sharing";
      const savedSheetUrl = localStorage.getItem('rupay_sheet_url');
      const activeSheetUrl = (savedSheetUrl && savedSheetUrl.includes('/d/')) ? savedSheetUrl : GOOGLE_SHEET_URL;
      const sheetLink = document.getElementById('sheet-link-btn');
      if (sheetLink) sheetLink.href = activeSheetUrl;

      const savedBrand = localStorage.getItem('rupay_active_brand');
      if (savedBrand && BRAND_CONFIG.some(b => b.key === savedBrand)) {
        activeBrandKey = savedBrand;
      }

      const savedTime = localStorage.getItem('rupay_sync_time');
      const now = new Date();
      syncTimestamp = savedTime || now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      updateHeader();
      renderBrandsCarousel();
      renderVouchersFeed();

      // Check biometrics availability and lock vault on launch
      await checkBiometricsAvailability();
      lockVault();

      if (securityState.hasBiometrics) {
        setTimeout(() => {
          unlockWithBiometrics();
        }, 350);
      }
    })();
  </script>
