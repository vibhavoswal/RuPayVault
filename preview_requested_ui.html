    function normalizeBrandKey(brand) {
      if (!brand) return 'Other';
      const b = brand.toLowerCase().replace(/[\s\.\-_]/g, '');
      if (b.includes('recent') || b.includes('newly') || b === 'recentlyadded') return 'RecentlyAdded';
      if (b.includes('lakme')) return 'Lakme';
      if (b.includes('fourfountain') || b.includes('four')) return 'FourFountains';
      if (b.includes('kalyan')) return 'Kalyan';
      if (b.includes('myntra')) return 'Myntra';
      if (b.includes('bigbasket')) return 'BigBasket';
      if (b.includes('reliance')) return 'Reliance';
      if (b.includes('apollo')) return 'Apollo';
      if (b.includes('amazon')) return 'AmazonPrime';
      if (b.includes('cult')) return 'CultFit';
      if (b.includes('timesprime')) return 'TimesPrime';
      if (b.includes('tattvaspa') || b.includes('tattva')) return 'TattvaSpa';
      if (b.includes('taxspanner') || b.includes('tax')) return 'TaxSpanner';
      if (b.includes('thyrocare')) return 'Thyrocare';
      if (b.includes('uber')) return 'Uber';
      return brand;
    }

    function parseTimestamp(ts) {
      if (!ts) return 0;
      const clean = String(ts).replace(/'IST'/i, '').replace(/IST/i, '').trim();
      const parsed = Date.parse(clean);
      if (!isNaN(parsed)) return parsed;

      const m = clean.match(/(\d{1,2})[-/ ]([A-Za-z]{3})[-/ ](\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
      if (m) {
        const day = parseInt(m[1], 10);
        const monthStr = m[2].toLowerCase();
        const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
        const month = months[monthStr.slice(0, 3)] ?? 0;
        const year = parseInt(m[3], 10);
        let hour = parseInt(m[4], 10);
        const min = parseInt(m[5], 10);
        const sec = m[6] ? parseInt(m[6], 10) : 0;
        const meridiem = m[7] ? m[7].toUpperCase() : null;
        if (meridiem === 'PM' && hour < 12) hour += 12;
        if (meridiem === 'AM' && hour === 12) hour = 0;
        return new Date(year, month, day, hour, min, sec).getTime();
      }
      return 0;
    }

        const total = count * denom;

          html += `
            <div class="py-16 text-center text-neutral-500">
              <p class="text-sm font-semibold">No vouchers available for ${b ? b.name : 'this brand'}</p>
            </div>
          `;
        }
      } else {
        html += vs.map((v, i) => {
          const isChecked = selectedCodes.has(v.code);
          const brandName = v.brand || (b ? b.name : 'Voucher');
          return `
            <div class="rounded-2xl p-4 bg-gradient-to-br from-neutral-900 to-neutral-950 border border-neutral-800 space-y-3 shadow-xl relative overflow-hidden transition-all ${isChecked ? 'ring-2 ring-amber-400 bg-amber-950/20' : ''}">
              
              <!-- Card Header Row: Checkbox, PASS # or Brand Badge, Date/Expiry -->
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-2.5">
                  ${isSelectMode ? `
                    <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSelectCode('${v.code}')" class="w-4 h-4 rounded accent-amber-400 cursor-pointer">
                  ` : ''}
                  ${isRecentTab ? `
                    <span class="px-2.5 py-0.5 rounded-lg bg-neutral-800 text-amber-300 border border-amber-500/30 text-[11px] font-bold">
                      ${brandName}${v.amount > 0 ? ` · ₹${v.amount.toLocaleString()}` : ''}
                    </span>
                  ` : `
                    <span class="font-mono-apple font-bold text-amber-400/90 text-[11px] tracking-wider">PASS #${i + 1}</span>
                  `}
                </div>
                
                ${!isRecentTab ? (v.redeemedOn ? `
                  <span class="px-2 py-0.5 rounded-full bg-amber-950/80 border border-amber-500/30 text-amber-300 text-[10px] font-medium">
                    Redeemed on: ${v.redeemedOn}
                  </span>
                ` : `
                  <span class="text-[10px] text-neutral-400">Valid: ${v.expiry || '31 Dec 2026'}</span>
                `) : `
                  <span class="text-[9px] font-bold px-2 py-0.5 rounded bg-amber-400/20 text-amber-300 border border-amber-400/30">ACTIVE</span>
                `}
              </div>

              <!-- Timestamp Badge (ONLY for Recently Added tab) -->
              ${isRecentTab && v.timestampIST ? `
                <div class="flex items-center justify-between text-[10px] font-mono-apple text-amber-300/90 bg-amber-950/30 px-2.5 py-1 rounded-lg border border-amber-500/20">
                  <span>⏱ Ingested: ${v.timestampIST}</span>
                  <span class="text-neutral-400 font-sans">${v.redeemedOn ? `Redeemed: ${v.redeemedOn}` : (v.expiry || 'Active')}</span>
                </div>
              ` : ''}

              <!-- Embossed Monospace Code Box (Tap anywhere to copy) -->
              <div onclick="copyCode('${v.code}')" class="p-3 rounded-xl bg-black/75 border border-neutral-800 flex items-center justify-between cursor-pointer hover:border-amber-500/40 active:scale-[0.99] transition-all">
                <div class="space-y-0.5">
                  <div class="flex items-center gap-2">
                    <span class="text-[9px] font-bold uppercase text-neutral-400 tracking-wider">CODE</span>
                    <span class="font-mono-apple text-base font-bold text-white tracking-wider">${v.code}</span>
                  </div>
                  ${v.pin ? `
                    <div class="flex items-center gap-2 pt-0.5">
                      <span class="text-[9px] font-bold uppercase text-neutral-400 tracking-wider">PIN</span>
                      <span class="font-mono-apple text-sm font-bold text-amber-300">${v.pin}</span>
                    </div>
                  ` : ''}
                </div>
                <button onclick="event.stopPropagation(); copyCode('${v.code}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-400 to-amber-500 text-black hover:brightness-110 active:scale-95 shadow-md transition-all">
                  Copy
                </button>
              </div>

            </div>
          `;
        }).join('');
      }

      feed.innerHTML = html;
      updateFabVisibility();
    }

    // Switch Active Brand
    function setBrand(brandKey) {
      activeBrandKey = brandKey;
      localStorage.setItem('rupay_active_brand', brandKey);
      selectedCodes.clear();
      updateHeader();
      renderBrandsCarousel();
      renderVouchersFeed();
      document.getElementById('vouchers-feed').scrollTop = 0;
    }

    // Toggle Select Mode
    function toggleSelectMode() {
      isSelectMode = !isSelectMode;
      const btn = document.getElementById('btn-select');
      if (isSelectMode) {
        btn.textContent = 'Done';
        btn.classList.remove('bg-neutral-800', 'text-amber-300');
        btn.classList.add('bg-amber-400', 'text-black', 'shadow-md');
      } else {
        btn.textContent = 'Select';
        btn.classList.add('bg-neutral-800', 'text-amber-300');
        btn.classList.remove('bg-amber-400', 'text-black', 'shadow-md');
        selectedCodes.clear();
      }
      renderVouchersFeed();
    }

    // Toggle Checkbox for a Code
    function toggleSelectCode(code) {
      if (selectedCodes.has(code)) {
        selectedCodes.delete(code);
      } else {
        selectedCodes.add(code);
      }
      renderVouchersFeed();
    }

    // Manage Floating WhatsApp Button (FAB)
    function updateFabVisibility() {
      const fab = document.getElementById('fab-whatsapp');
      const badge = document.getElementById('fab-badge');

      if (isSelectMode) {
        fab.classList.remove('hidden');
        fab.classList.add('flex');
        if (selectedCodes.size > 0) {
          badge.textContent = selectedCodes.size;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      } else {
        fab.classList.add('hidden');
        fab.classList.remove('flex');
      }
    }

    // Share Selected Vouchers on WhatsApp with Native Share Sheet
    function shareSelectedOnWhatsApp() {
      const allVs = liveVouchers[activeBrandKey] || [];
      const vs = allVs.filter(v => selectedCodes.has(v.code));
      const targets = vs.length > 0 ? vs : allVs;
      const b = BRAND_CONFIG.find(x => x.key === activeBrandKey);
      const isRecentTab = activeBrandKey === 'RecentlyAdded';
      const count = targets.length;

      let text = isRecentTab ? `⚡ Recently Added RuPay Vouchers\n\n` : `${b ? b.name : activeBrandKey} Vouchers\n\n`;
      let total = 0;
      targets.forEach((v, i) => {
        const vBrand = v.brand || (b ? b.name : 'Voucher');
        if (isRecentTab) {
          text += `${i + 1}. [${vBrand}${v.amount > 0 ? ` · ₹${v.amount.toLocaleString()}` : ''}] Code: ${v.code}\n`;
        } else {
          text += `${i + 1}. Code: ${v.code}\n`;
        }
        if (v.pin) text += `PIN: ${v.pin}\n`;
        text += `\n`;
        total += (v.amount || (b ? b.denom : 0));
      });
      text += `Total ${count} vouchers\n`;
      if (total > 0) text += `Total Value: ₹${total.toLocaleString()}`;

      // Open Native Share Sheet if available, else WhatsApp direct
      if (navigator.share) {
        navigator.share({
          title: `${b ? b.name : activeBrandKey} Vouchers`,
          text: text
        }).then(() => {
          showToast('Shared successfully');
        }).catch(err => {
          if (err && err.name !== 'AbortError') {
            openDirectWhatsApp(text);
          }
        });
      } else {
        openDirectWhatsApp(text);
      }
    }

    // Share Single Voucher on WhatsApp
    function shareSingleWhatsApp(code) {
      const allVs = liveVouchers[activeBrandKey] || [];
      const v = allVs.find(x => x.code === code);
      if (!v) return;
      const b = BRAND_CONFIG.find(x => x.key === activeBrandKey);
      const denom = b ? b.denom : 0;

      let text = `${b ? b.name : activeBrandKey} Voucher\n\n`;
      text += `1. Code: ${v.code}\n`;
      if (v.pin) text += `PIN: ${v.pin}\n\n`;
      text += `Total 1 voucher\n`;
      if (denom > 0) text += `Value: ₹${denom}`;

      if (navigator.share) {
        navigator.share({
          title: `${b ? b.name : activeBrandKey} Voucher`,
          text: text
        }).catch(() => openDirectWhatsApp(text));
      } else {
        openDirectWhatsApp(text);
      }
    }

    function openDirectWhatsApp(text) {
      copyToClipboard(text);
      showToast('Copied to clipboard! Opening WhatsApp...');
      const whatsappUrl = `whatsapp://send?text=${encodeURIComponent(text)}`;
      window.location.href = whatsappUrl;
    }

    // Copy Single Code
    function copyCode(code) {
      copyToClipboard(code);
      showToast(`Copied code: ${code}`);
    }

    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.position = 'absolute';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
      }, 2000);
    }

    // Live Sync with Google Sheets
    async function syncWithGoogleSheets() {
      const spinner = document.getElementById('sync-spinner');
      spinner.classList.add('animate-spin');
      showToast('Checking Gmail & syncing...');

      try {
        const syncUrl = API_ENDPOINT + (API_ENDPOINT.includes('?') ? '&' : '?') + 'ingest=true';
        const res = await fetch(syncUrl);
        const data = await res.json();

        if (data.vouchers && data.vouchers.length) {
          const grouped = { RecentlyAdded: [] };
          data.vouchers.forEach(v => {
            const rawBrand = v.brand || 'Other';
            const normKey = normalizeBrandKey(rawBrand);
            if (!grouped[normKey]) grouped[normKey] = [];

            let redeemedOn = null;
            if (v.dateOfIssue && String(v.dateOfIssue).trim() && String(v.dateOfIssue).trim() !== '31 Dec 2026') {
              redeemedOn = String(v.dateOfIssue).trim();
            }

            const item = {
              code: v.code || '-',
              pin: v.pin || '',
              expiry: v.dateOfIssue || '31 Dec 2026',
              redeemedOn: redeemedOn,
              brand: rawBrand,
              amount: Number(v.amount) || 0,
              timestampIST: (v.timestampIST && String(v.timestampIST).trim() !== '' && String(v.timestampIST).trim() !== 'null') ? String(v.timestampIST).trim() : null,
              status: (v.status || 'ACTIVE').toUpperCase()
            };

            grouped[normKey].push(item);
            if (item.timestampIST) {
              grouped.RecentlyAdded.push(item);
            }
          });

          Object.keys(grouped).forEach(k => {
            liveVouchers[k] = grouped[k];
          });
          localStorage.setItem('rupay_vouchers_grouped', JSON.stringify(liveVouchers));
        }

        if (data.sheetUrl) {
          const sheetLink = document.getElementById('sheet-link-btn');
          if (sheetLink) sheetLink.href = data.sheetUrl;
          localStorage.setItem('rupay_sheet_url', data.sheetUrl);
        }

        const now = new Date();
        syncTimestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        localStorage.setItem('rupay_sync_time', syncTimestamp);
        showToast('Sheets synced successfully');
      } catch (err) {
        console.warn('Sync failed, using cached data:', err);
        const now = new Date();
        syncTimestamp = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        showToast(`Synced at ${syncTimestamp} (cached)`);
      } finally {
        spinner.classList.remove('animate-spin');
        updateHeader();
        renderBrandsCarousel();
        renderVouchersFeed();
      }
    }

    // Initial Render
    (function init() {
      const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/13TlzJsJ3E3vbXYi_FASgQtr9rhORpEho0I57CFTQcOA/edit?usp=sharing";
      const savedSheetUrl = localStorage.getItem('rupay_sheet_url');
      const activeSheetUrl = (savedSheetUrl && savedSheetUrl.includes('/d/')) ? savedSheetUrl : GOOGLE_SHEET_URL;
      const sheetLink = document.getElementById('sheet-link-btn');
      if (sheetLink) sheetLink.href = activeSheetUrl;

      const savedBrand = localStorage.getItem('rupay_active_brand');
      if (savedBrand && BRAND_CONFIG.some(b => b.key === savedBrand)) {
        activeBrandKey = savedBrand;
      }

      const cachedGrouped = localStorage.getItem('rupay_vouchers_grouped');
      if (cachedGrouped) {
        try {
          const parsed = JSON.parse(cachedGrouped);
          if (parsed && typeof parsed === 'object') {
            Object.keys(parsed).forEach(k => {
              liveVouchers[k] = parsed[k];
            });
          }
        } catch (e) {
          console.warn('Cache error:', e);
        }
      }

      const savedTime = localStorage.getItem('rupay_sync_time');
      const now = new Date();
      syncTimestamp = savedTime || now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      updateHeader();
      renderBrandsCarousel();
      renderVouchersFeed();
    })();
  </script>
</body>
</html>
